[package]
name = "gamepad-store"
version = "0.1.0"
description = "GamePad store: game licenses and a resale market that pays the studio a royalty on every resale"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "gamepad_store"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }

[dev-dependencies]
solana-program-test = "2.3"
solana-sdk = "2.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
# cfgs set by Anchor's macros and by the Solana build target
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))'] }
