# Publishes main to GitHub Pages at gamedotpad.com. Run it from the Actions tab. One-time setup
# (Pages source "GitHub Actions", the custom domain and the Namecheap DNS records) is in README.md.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_STORE_ADDRESS_BASE_SEPOLIA: ${{ vars.VITE_STORE_ADDRESS_BASE_SEPOLIA }}
          VITE_STORE_ADDRESS_SEPOLIA: ${{ vars.VITE_STORE_ADDRESS_SEPOLIA }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
